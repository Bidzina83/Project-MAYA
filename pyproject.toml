[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "maya"
version = "0.0.0"
description = "Project MAYA"
readme = "README.md"
authors = [
  { name = "hermes" },
]
license = { text = "MIT" }
# keep dependencies minimal here; CI will install requirements-dev.txt as needed

dynamic = []

[tool.setuptools]
# repository uses top-level package layout (not src/). Map package-dir to project root.
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["maya*", "hermes*", "plugins*"]
