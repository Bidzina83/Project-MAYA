[alembic]
script_location = alembic
# sqlalchemy.url should be set by the operator or by passing -x sqlalchemy.url=... when invoking alembic
sqlalchemy.url = sqlite:///memory_registry.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
