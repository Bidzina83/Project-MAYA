name: Ingest tests

on:
  pull_request:
    paths:
      - 'plugins/memory/ingest/**'
      - '.github/workflows/ingest-integration.yml'
  push:
    branches: [ main ]

jobs:
  unit:
    name: Unit tests (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: |
          PYTHONPATH=/opt/hermes pytest -q plugins/memory/ingest/tests -k "not openai_integration"

  integration-openai:
    name: Integration tests (OpenAI) [optional]
    runs-on: ubuntu-latest
    needs: unit
    if: startsWith(secrets.OPENAI_API_KEY, 'sk-')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run OpenAI integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PYTHONPATH=/opt/hermes pytest -q plugins/memory/ingest/tests -k openai_integration
