name: Memory Monitor

on:
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run registry monitor
        run: |
          PYTHONPATH=${{ github.workspace }} python3 plugins/memory/ingest/bin/registry_monitor.py --storage-root "${{ github.workspace }}" > report.json
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-report
          path: report.json
      - name: Create or update monitor issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.json', 'utf8');
            const title = 'Memory Monitor (automated)';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            let issue = issues.find(i => i.title === title);
            const body = 'Automated memory monitor run for ' + new Date().toISOString() + '\n\n```json\n' + report + '\n```';
            if (issue) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
