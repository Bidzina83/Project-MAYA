name: Project context guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-project-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Validate Project MAYA context files
        run: python scripts/validate_project_maya_context.py
