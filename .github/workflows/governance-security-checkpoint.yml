name: Governance Security Checkpoint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Maya security checkpoint
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout pinned Hermes objects
        uses: actions/checkout@v5
        with:
          repository: Bidzina83/hermes-agent
          ref: b13e2fd6948a59eeb59fe618914147d97a2ee90a
          path: .codex-build/hermes-objects
          persist-credentials: false
      - name: Prepare native Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned preparation tool
        run: python -m pip install uv==0.11.21
      - name: Reconstruct independent security stages and ordinary control
        run: |
          python scripts/prepare_governance_security_checkpoint.py --source-repo .codex-build/hermes-objects --output .codex-build/security-a
          python scripts/prepare_governance_security_checkpoint.py --source-repo .codex-build/hermes-objects --output .codex-build/security-b
          cmp .codex-build/security-a/security-checkpoint-manifest.json .codex-build/security-b/security-checkpoint-manifest.json
          python scripts/prepare_governance_baseline.py --source-repo .codex-build/hermes-objects --output .codex-build/security-ordinary --ordinary-baseline
      - name: Prepare exact locked dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/maya-security-native-env
          UV_CACHE_DIR: ${{ runner.temp }}/maya-security-dependency-cache
        run: uv sync --project .codex-build/security-a/source --locked --no-install-project --extra dev --extra messaging --extra anthropic --extra bedrock --no-build --no-python-downloads --python 3.13
      - name: Run security probes and native regression controls offline
        env:
          SECURITY_PYTHON: ${{ runner.temp }}/maya-security-native-env/bin/python
        run: |
          python scripts/run_governance_native_regressions.py --stage .codex-build/security-a --python "$SECURITY_PYTHON" --mode security --security-checkpoint
          python scripts/run_governance_native_regressions.py --stage .codex-build/security-a --python "$SECURITY_PYTHON" --mode bounded --security-checkpoint
          python scripts/run_governance_native_regressions.py --stage .codex-build/security-ordinary --python "$SECURITY_PYTHON" --mode bounded
      - name: Preserve evidence without native source or customer state
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: governance-security-checkpoint-linux
          path: |
            .codex-build/security-a/*manifest.json
            .codex-build/security-a/native-dependencies.json
            .codex-build/security-a/native-*-result.json
            .codex-build/security-ordinary/baseline-manifest.json
            .codex-build/security-ordinary/native-dependencies.json
            .codex-build/security-ordinary/native-*-result.json
          if-no-files-found: warn
