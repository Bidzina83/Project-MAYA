name: pyproject-validate
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-pyproject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Fail if conflict markers present
        run: |
          if grep -n "<<<<<<<\|>>>>>>>" pyproject.toml; then
            echo "Conflict markers found in pyproject.toml" >&2
            grep -n "<<<<<<<\|>>>>>>>" pyproject.toml
            exit 1
          fi
      - name: Validate TOML
        run: |
          python - <<PY
          import tomllib,sys
          try:
              tomllib.loads(open('pyproject.toml','rb').read())
              print('pyproject.toml is valid TOML')
          except Exception as e:
              print('TOML parse failed:', e, file=sys.stderr)
              sys.exit(2)
          PY
      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
