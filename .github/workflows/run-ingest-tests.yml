name: Run ingest tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        env:
          HERMES_STATE_TOKEN: ${{ secrets.HERMES_STATE_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock requests openai jsonschema
          # Try to fetch a single-file hermes_state implementation from the hermes-agent repo's main branch.
          # Use the raw file URL to avoid a git clone. If this succeeds, the file will be placed at
          # $GITHUB_WORKSPACE/hermes_state.py so `import hermes_state` works during tests.
          RAW_URL="https://raw.githubusercontent.com/NousResearch/hermes-agent/main/hermes_state.py"
          if curl -sSfL "$RAW_URL" -o "${GITHUB_WORKSPACE}/hermes_state.py"; then
            echo "Fetched hermes_state.py into workspace"
          else
            echo "Failed to fetch hermes_state.py from raw URL; attempting authenticated git install as fallback"
            if [ -n "$HERMES_STATE_TOKEN" ]; then
              echo "Attempting authenticated git install of hermes_state..."
              pip install "git+https://x-access-token:${HERMES_STATE_TOKEN}@github.com/NousResearch/hermes_state.git" || \
                echo "Authenticated git install failed; continuing with fallback in code"
            else
              echo "HERMES_STATE_TOKEN not set; skipping authenticated git install and relying on fallback"
            fi
          fi

          # Explicit verification: print whether hermes_state.py is present and show the first 3 lines
          if [ -f "${GITHUB_WORKSPACE}/hermes_state.py" ]; then
            echo "VERIFICATION: hermes_state.py present in workspace"
            echo "--- hermes_state.py (first 3 lines) ---"
            head -n 3 "${GITHUB_WORKSPACE}/hermes_state.py" || true
            echo "--- end ---"
          else
            echo "VERIFICATION: hermes_state.py MISSING"
          fi

          # Install package and dev deps
          pip install -e .
          # Optional (heavy): pip install sentence-transformers

      - name: Prepare pytest basetemp
        run: |
          mkdir -p "${{ github.workspace }}/.pytest_tmp"
          echo "PYTEST_ADDOPTS=--basetemp=${{ github.workspace }}/.pytest_tmp" >> $GITHUB_ENV

      - name: Mirror repo plugins into /opt/hermes for tests
        run: |
          echo "Creating /opt/hermes and copying plugins/memory into it so tests that load from /opt/hermes succeed"
          sudo mkdir -p /opt/hermes/plugins
          sudo rm -rf /opt/hermes/plugins/memory || true
          sudo cp -a "${{ github.workspace }}/plugins/memory" /opt/hermes/plugins/memory || true

      - name: Ensure scheduler/dev scripts present
        run: |
          if [ -f "maya-dev/ensure_scripts.sh" ]; then
            chmod +x maya-dev/ensure_scripts.sh || true
            ./maya-dev/ensure_scripts.sh
          else
            echo "maya-dev/ensure_scripts.sh not found - skipping ensure_scripts step"
          fi

      - name: Run ingest tests
        run: |
          mkdir -p "${{ github.workspace }}/.pytest_tmp"
          export PYTEST_ADDOPTS="--basetemp=${{ github.workspace }}/.pytest_tmp"
          # Ensure workspace root is on PYTHONPATH so imports like
          # 'plugins.memory.adapters.*' resolve correctly during test collection.
          export PYTHONPATH="/opt/hermes:${{ github.workspace }}:${{ github.workspace }}/maya-dev/.hermes_shim:$PYTHONPATH"
          pytest -c /dev/null -q plugins/memory/ingest/tests -p no:xdist

      - name: "Optional: Run a smoke embedding (OpenAI)"
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            # Keep PYTHONPATH consistent with the test step so imports resolve the
            # same way in the smoke test as they do during pytest collection.
            export PYTHONPATH="/opt/hermes:${{ github.workspace }}:${{ github.workspace }}/maya-dev/.hermes_shim:$PYTHONPATH"
            python -c "from hermes.plugins.memory.ingest.embedder_wrapper import EmbeddingClient; print(EmbeddingClient(backend='openai', model=None).embed_documents(['hello world']))"
          else
            echo "OPENAI_API_KEY not set - skipping OpenAI smoke test"
          fi
