name: Run ingest tests

on:
  workflow_call:
    inputs:
      OPENAI_API_KEY:
        required: false
        type: string
      HF_API_KEY:
        required: false
        type: string
  push:
    branches: [ main, 'ci/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-matrix:
    name: Ingest tests matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install package in editable mode if possible, fallback to install current dir
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e . || pip install .
          fi
          pip install pytest
      - name: Prepare pytest tempdir
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.pytest_tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/.pytest_tmp" >> $GITHUB_ENV
          echo "PYTEST_ADDOPTS=--basetemp=$GITHUB_WORKSPACE/.pytest_tmp" >> $GITHUB_ENV
      - name: Run ingest tests
        run: |
          pytest -q plugins/memory/ingest/tests -p no:xdist

  smoke-openai:
    name: OpenAI smoke test (optional)
    runs-on: ubuntu-latest
    needs: test-matrix
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai
          # ensure package importable
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e . || pip install .
          fi
      - name: Run OpenAI smoke embedding (skip if secret missing)
        env:
          OPENAI_API_KEY: ${{ github.event.inputs.OPENAI_API_KEY != '' && github.event.inputs.OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY not set; skipping OpenAI smoke"
            exit 0
          fi
          python - <<'PY'
            import os
            from hermes.plugins.memory.ingest.backends.openai_backend import OpenAIBackend
            b = OpenAIBackend()
            vecs = b.embed_batch(["smoke test"])
            print('len(vecs)=', len(vecs))
          PY

  smoke-hf:
    name: Hugging Face smoke test (optional)
    runs-on: ubuntu-latest
    needs: test-matrix
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          # ensure package importable
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e . || pip install .
          fi
      - name: Run HF smoke embedding (skip if secret missing)
        env:
          HF_API_KEY: ${{ github.event.inputs.HF_API_KEY != '' && github.event.inputs.HF_API_KEY || secrets.HF_API_KEY }}
        run: |
          if [ -z "${HF_API_KEY:-}" ]; then
            echo "HF_API_KEY not set; skipping HuggingFace smoke"
            exit 0
          fi
          python - <<'PY'
            import os
            from hermes.plugins.memory.ingest.backends.hf_backend import HFBackend
            b = HFBackend()
            vecs = b.embed_batch(["smoke test"])
            print('len(vecs)=', len(vecs))
          PY
