name: Run ingest tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock requests openai
          pip install -e .
          # Optional (heavy): pip install sentence-transformers
      - name: Mirror repo plugins into /opt/hermes for tests
        run: |
          echo "Creating /opt/hermes and copying plugins/memory into it so tests that load from /opt/hermes succeed"
          sudo mkdir -p /opt/hermes
          sudo rm -rf /opt/hermes/plugins/memory || true
          candidates=(
            "${GITHUB_WORKSPACE}/plugins/memory"
            "${GITHUB_WORKSPACE}/Project-MAYA/plugins/memory"
            "${GITHUB_WORKSPACE}/Project-MAYA/Project-MAYA/plugins/memory"
            "$(pwd)/plugins/memory"
          )
          found=false
          for c in "${candidates[@]}"; do
            if [ -d "$c" ]; then
              echo "Found plugins at $c"
              sudo cp -a "$c" /opt/hermes/plugins/memory
              found=true
              break
            fi
          done
          if [ "$found" = false ]; then
            echo "Could not find plugins/memory at candidates: ${candidates[*]}"
            ls -la "${GITHUB_WORKSPACE}" || true
            ls -la "${GITHUB_WORKSPACE}/Project-MAYA" || true
            ls -la "${GITHUB_WORKSPACE}/Project-MAYA/Project-MAYA" || true
            exit 1
          fi

      - name: Ensure scheduler/dev scripts present
        run: |
          chmod +x maya-dev/ensure_scripts.sh || true
          ./maya-dev/ensure_scripts.sh

      - name: Run ingest tests
        run: |
          export PYTHONPATH="${{ github.workspace }}/maya-dev/.hermes_shim"
          pytest -c /dev/null -q plugins/memory/ingest/tests -p no:xdist

      - name: "Optional: Run a smoke embedding (OpenAI)"
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            export PYTHONPATH="${{ github.workspace }}/maya-dev/.hermes_shim"
            python -c "from hermes.plugins.memory.ingest.embedder_wrapper import EmbeddingClient; print(EmbeddingClient(backend='openai', model=None).embed_documents(['hello world']))"
          else
            echo "OPENAI_API_KEY not set - skipping OpenAI smoke test"
          fi
