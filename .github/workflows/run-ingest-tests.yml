name: Run ingest tests

on:
  push:
    branches: [ main, 'ci/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-matrix:
    name: Ingest tests matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run ingest tests
        env:
          PYTHONPATH: /opt/data/.hermes_shim
        run: |
          # Use the project's shim path for imports; adapt if runners need different layout
          PYTHONPATH=/opt/data/.hermes_shim pytest -c /dev/null -q plugins/memory/ingest/tests -p no:xdist

  smoke-openai:
    name: OpenAI smoke test (optional)
    runs-on: ubuntu-latest
    needs: test-matrix
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pytest
      - name: Run OpenAI smoke embedding
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: /opt/data/.hermes_shim
        run: |
          python - <<'PY'
import os
from hermes.plugins.memory.ingest.backends.openai_backend import OpenAIBackend
b = OpenAIBackend()
vecs = b.embed_batch(["smoke test"])
print('len(vecs)=', len(vecs))
PY
