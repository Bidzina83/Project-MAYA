name: memory-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install package (editable) and dev dependencies
        env:
          HERMES_STATE_TOKEN: ${{ secrets.HERMES_STATE_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          # Attempt authenticated install of hermes_state; best-effort and non-fatal.
          if [ -n "${{ env.HERMES_STATE_TOKEN }}" ]; then
            echo "Attempting authenticated install of hermes_state from git..."
            pip install "git+https://x-access-token:${{ env.HERMES_STATE_TOKEN }}@github.com/NousResearch/hermes_state.git" || \
              (echo "WARNING: hermes_state install failed or repo not accessible; continuing with fallback" && true)
          else
            echo "HERMES_STATE_TOKEN not set; skipping hermes_state install and relying on fallback"
          fi
          pip install -e .
          pip install pytest jsonschema

      - name: Prepare workspace (set PYTHONPATH)
        run: |
          echo "PYTHONPATH=/opt/hermes:$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV


      - name: Run tests
        run: |
          # Use a writable basetemp to avoid permission issues
          mkdir -p ${{ github.workspace }}/.pytest_tmp
          export PYTEST_ADDOPTS="--basetemp=${{ github.workspace }}/.pytest_tmp"
          pytest -q
