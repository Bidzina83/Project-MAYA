name: memory-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install package (editable) and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest jsonschema

      - name: Prepare workspace for hermes and maya_dev imports (fallback)
        run: |
          # Create a local hermes package that points to the plugins/ tree so tests can import hermes.plugins.*
          mkdir -p hermes
          # ensure hermes is a proper package for import
          if [ ! -f hermes/__init__.py ]; then
            printf "# temporary package created by CI for tests\n" > hermes/__init__.py
          fi
          if [ ! -e hermes/plugins ]; then
            ln -s "$GITHUB_WORKSPACE/plugins" hermes/plugins
          fi
          # Create a shim maya_dev package so tests that import maya_dev.* succeed (fallback)
          mkdir -p maya_dev
          if [ ! -f maya_dev/__init__.py ]; then
            cat > maya_dev/__init__.py <<'PY'
# maya_dev shim to expose plugins/ under maya_dev namespace
import os
import sys
_this = os.path.dirname(__file__)
_plugins_path = os.path.join(os.getcwd(), 'plugins')
if _plugins_path not in __path__:
    __path__.insert(0, _plugins_path)
PY
          fi

          echo "PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV

      - name: Run tests
        run: |
          # Use a writable basetemp to avoid permission issues
          mkdir -p ${{ github.workspace }}/.pytest_tmp
          export PYTEST_ADDOPTS="--basetemp=${{ github.workspace }}/.pytest_tmp"
          pytest -q
