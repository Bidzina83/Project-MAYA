name: memory-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install package (editable) and dev dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          # Install hermes_state from git using a GitHub token to authenticate the clone.
          # The token is provided by actions as the repository-scoped GITHUB_TOKEN secret.
          pip install git+https://${{ secrets.GITHUB_TOKEN }}@github.com/NousResearch/hermes_state.git
          pip install -e .
          pip install pytest jsonschema

      - name: Prepare workspace (set PYTHONPATH)
        run: |
          echo "PYTHONPATH=/opt/hermes:$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV


      - name: Run tests
        run: |
          # Use a writable basetemp to avoid permission issues
          mkdir -p ${{ github.workspace }}/.pytest_tmp
          export PYTEST_ADDOPTS="--basetemp=${{ github.workspace }}/.pytest_tmp"
          pytest -q
