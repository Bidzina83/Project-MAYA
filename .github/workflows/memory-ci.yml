name: memory-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install package (editable) and dev dependencies
        env:
          HERMES_STATE_TOKEN: ${{ secrets.HERMES_STATE_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          # Prefer installing hermes_state directly from the Project owner's repo for CI reproducibility
          echo "Installing hermes_state from Bidzina83/hermes-agent (git)"
          pip install "git+https://github.com/Bidzina83/hermes-agent.git@955fa40062874faed1108f831864d29724a6250c#egg=hermes_state" ||             (echo "Primary install failed; attempting NousResearch mirror" && pip install "git+https://github.com/NousResearch/hermes-agent.git#egg=hermes_state") || true

          # Install the project editable and dev deps
          pip install -e ".[test]" || pip install -e .
          # Install test deps (fallback to minimal set if requirements-dev.txt is absent)
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt || pip install pytest jsonschema
          else
            pip install pytest jsonschema || true
          fi

      - name: Prepare workspace (set PYTHONPATH)
        run: |
          echo "PYTHONPATH=/opt/hermes:$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV


      - name: Run tests
        run: |
          # Use a writable basetemp to avoid permission issues
          mkdir -p ${{ github.workspace }}/.pytest_tmp
          export PYTEST_ADDOPTS="--basetemp=${{ github.workspace }}/.pytest_tmp"
          pytest -q
